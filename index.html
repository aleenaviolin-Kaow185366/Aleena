<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe08a;--card:#fff;--ink:#2b2320;--mute:#8a7a6c;--line:#f0e0cc;--coral:#f26a52;--gold:#e0a020;--ok:#2f7d4f;--okbg:#e3f3e8;--bad:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#201814;--card:#2d231d;--ink:#fbeee0;--mute:#b9a591;--line:#43342b;--coral:#ff8a72;--gold:#e9c46a;--ok:#6fcf97;--okbg:#1f3a2a;--bad:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#201814;--card:#2d231d;--ink:#fbeee0;--mute:#b9a591;--line:#43342b;--coral:#ff8a72;--gold:#e9c46a;--ok:#6fcf97;--okbg:#1f3a2a;--bad:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Mali','Sarabun',system-ui,sans-serif;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 110px}
.hi{font-size:1.5rem;margin:.2rem 0}h3{margin:20px 0 8px}h2{margin:6px 0}
.sub{color:var(--mute);margin:0 0 8px}small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.ring{display:flex;gap:14px;align-items:center}
.rg{width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--coral) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.rg b{background:var(--card);border-radius:50%;width:58px;height:58px;display:grid;place-items:center}
.btn{background:var(--coral);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-weight:700}.btn.sm{padding:6px 14px;margin-top:6px}
.btn2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:8px 8px 0 0}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:24px 12px;margin-top:22px}
.cc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 10px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.ey{position:absolute;top:-12px;left:50%;transform:translateX(-50%)}
.ct{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem}.ct.big{width:56px;height:56px;background:rgba(255,255,255,.25)}
.pb{height:8px;width:100%;background:var(--line);border-radius:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--coral);width:0;transition:width .3s}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.tl{aspect-ratio:1;border:3px solid var(--card);border-radius:20px;color:#fff;font-weight:700;font-size:.78rem;transform:rotate(var(--r));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;box-shadow:0 3px 0 rgba(0,0,0,.15)}.tl span{font-size:1.8rem}
.hd{border-radius:22px;padding:14px;color:#fff}.hd p{margin:0 0 8px}.hd .pb{background:rgba(255,255,255,.3)}.hd .pb i{background:#fff}.hd small{color:#fff;opacity:.9}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px}.hd .ghost{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.lst{display:grid;gap:8px}.row small{display:block}.row.lk{opacity:.55;cursor:not-allowed}.sr{color:var(--gold)}
.bn{background:var(--coral);color:#fff;border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center;font-size:1.05rem}.bn>span{font-size:2rem}
.pr{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px;align-items:center;margin:10px 0;font-size:.9rem}
.medals{display:flex;gap:10px;font-size:1.7rem}.medals span{filter:grayscale(1);opacity:.35}.medals span.on{filter:none;opacity:1}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;text-align:center}.st3 b{display:block;font-size:1.3rem}
.av{width:72px;height:72px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:700;margin:0 auto}
.ob{text-align:center;padding-top:30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ob input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0}
.nav button{background:none;border:0;border-radius:20px;padding:8px 12px;font-size:1.2rem;display:flex;gap:6px;align-items:center}
.nav button small{font-size:.8rem;font-weight:700;color:inherit}.nav button:not(.on) small{display:none}.nav button.on{background:var(--coral);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.how{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem;color:var(--mute);margin:10px 0}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}.col{display:flex;flex-direction:column;gap:8px}
.it{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;min-height:58px}
.it.term{font-weight:700;font-size:1.02rem}.it small{display:block;font-size:.78rem}
.it.sel{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--card))}
.it.done{border-color:var(--ok);background:var(--okbg);cursor:default;opacity:.85}
.it.bad{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ov>div{background:var(--card);border-radius:20px;padding:20px;max-width:400px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.stars{font-size:2rem;color:var(--gold);letter-spacing:4px}
.ls{text-align:left;margin:10px 0;font-size:.92rem}.ls div{padding:5px 0;border-bottom:1px solid var(--line)}.ls b{color:var(--coral)}
html{font-size:clamp(15px,.3vw + 14px,18px)}svg{max-width:100%}
.it,.row,.cc b,.tl{overflow-wrap:anywhere}
.ob{max-width:420px;margin:0 auto}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{z-index:10}.ov{z-index:50}.ov>div{max-height:90vh;max-height:90dvh}
.cc,.row,.it,.pr>*,.row>span{min-width:0}
.btn,.btn2,.ghost,.nav button{min-height:44px}
.ob input{font-size:16px}
@media (min-width:600px){
.wrap{max-width:720px;padding:24px 24px 120px}.nav{max-width:720px}
.cg,.tg{grid-template-columns:repeat(3,1fr)}.tg{gap:22px}
.lst{grid-template-columns:1fr 1fr}
.it{padding:14px;min-height:66px}.hi{font-size:1.9rem}
}
@media (min-width:1024px){
.nav{top:0;right:auto;width:230px;max-width:none;margin:0;flex-direction:column;justify-content:flex-start;gap:8px;padding:28px 14px;border-radius:0;border-top:0;border-right:1px solid var(--line)}
.nav button{font-size:1.1rem;padding:12px 16px}.nav button:not(.on) small{display:inline}
body.hasnav .wrap{margin-left:230px;max-width:none;padding:32px clamp(24px,5vw,72px) 60px}
.wrap>*{max-width:900px;margin-left:auto;margin-right:auto}
.wrap>.ob{max-width:420px}
}
@media (max-height:480px) and (orientation:landscape){.wrap{padding-bottom:90px}.ov>div{max-height:96vh}}
@media (max-width:380px){
.wrap{padding-left:12px;padding-right:12px}
.cg{gap:22px 8px}.cc{padding:16px 6px 10px}.tg{gap:10px}
.tl{font-size:.7rem;border-radius:16px}.tl span{font-size:1.5rem}
.board{gap:8px}.it{padding:8px;font-size:.9rem}.it.term{font-size:.92rem}
.pr{grid-template-columns:1fr auto}.pr .pb{grid-column:1/-1;order:3}
.ring{gap:10px}.rg{width:64px;height:64px}.rg b{width:46px;height:46px}
.nav button{padding:8px 10px}.st3 b{font-size:1.1rem}
}
@media (min-width:600px) and (max-width:1023px){.board{gap:16px}.col{gap:12px}.ov>div{max-width:460px}}
@media (min-width:1024px){.board{gap:20px}.col{gap:12px}.ov>div{max-width:480px}}
@media (max-height:480px) and (orientation:landscape){.hi{font-size:1.2rem}.nav{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.say{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px}
.wd{font-size:2.3rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.sbtn{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.sbtn .btn2{margin:0}
.mic{min-width:150px}.mic.rec{animation:pl 1s infinite}.btn:disabled{opacity:.6}

.sst{min-height:3em;margin:0;color:var(--mute)}
.spk{background:none;border:0;padding:0 4px;font-size:1rem}
@media (max-width:599px){.cg .cc:last-child:nth-child(odd){grid-column:1/-1}}
.card,.cc,.it,.how,.hd,.bn,.chips span,.bub{box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
body{background-image:radial-gradient(circle at 22px 22px,rgba(255,255,255,.28) 4px,transparent 5px);background-size:64px 64px}
.card,.cc{border:0;border-radius:26px}
.btn{border-radius:18px;font-size:1.05rem;box-shadow:0 5px 0 color-mix(in srgb,var(--coral) 65%,#000)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--coral) 65%,#000)}
.cht{display:inline-block;line-height:0;flex:none}.cht svg{display:block}.m2{display:none}
.cht.hop{animation:hop .6s}.cht.sad{animation:sd .5s}.cht.sad .m1{display:none}.cht.sad .m2{display:block}
@keyframes hop{30%{transform:translateY(-16px) rotate(-6deg)}65%{transform:translateY(0) rotate(5deg)}}
@keyframes sd{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.guide{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.bub{position:relative;background:var(--card);border-radius:20px;padding:10px 14px;font-weight:700}
.bub:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--card)}
.cav{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;overflow:hidden;flex:none}
.tl .cav{width:64px;height:64px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}.chips span{background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700}
.map{position:relative;max-width:440px;margin:14px auto 0;border-radius:30px;border:4px solid #fff;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,#cdf2ff 60%,var(--card)),color-mix(in srgb,#9be15d 75%,var(--card)))}
.map>svg{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.nd{position:absolute;width:68px;height:68px;margin-left:-34px;border-radius:50%;border:5px solid #fff;background:#cfd8dc;color:#fff;font-size:1.5rem;font-weight:700;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.nd.ok{background:#ffc928}.nd.cur{background:var(--coral);animation:pu 1.4s infinite}.nd.lk{cursor:not-allowed}.nd:active:not(.lk){transform:translateY(3px)}
.nd small{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);color:#f5a300;font-size:.95rem;white-space:nowrap;text-shadow:0 1px 0 #fff}
.rb{position:absolute;top:-12px;right:-12px;font-size:1.2rem;font-style:normal}
@keyframes pu{50%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 10px rgba(242,106,82,.28)}}
.pal{position:absolute;pointer-events:none;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{translate:0 -6px}}
.dc{position:absolute;font-size:1.7rem;font-style:normal;pointer-events:none;opacity:.9}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.md{background:var(--card);border:3px solid transparent;border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
.md b{font-size:.85rem;overflow-wrap:anywhere}.md small{font-size:.68rem;text-align:center;line-height:1.25}
.md.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--card))}
.clk{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:2px 10px 2px 4px;font-weight:700;margin-left:6px}
.clk.low{color:var(--bad);animation:pu2 .5s infinite}@keyframes pu2{50%{transform:scale(1.12)}}
#ch{transform-origin:13px 14px}.bar{flex-wrap:wrap}
.nav button svg{width:34px;height:34px;flex:none}
.lg{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.lg button{background:var(--card);border:3px solid transparent;border-radius:999px;padding:4px 14px;font-weight:700;min-height:38px;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
.lg button.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--card))}
.pkg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.pk{background:var(--card);border:3px solid transparent;border-radius:16px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
.pk .cht svg{width:100%;height:auto;max-width:52px}.pk small{font-size:.68rem;overflow-wrap:anywhere}
.pk.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--card))}
@media (max-width:340px){.pkg{grid-template-columns:repeat(4,1fr)}}
.hide{display:none!important}
</style>

function tx(s){if(S.lang!=="en"||!hasTh(s))return s;
 const m=s.trim();if(EN[m])return s.replace(m,EN[m]);
 const i=s.lastIndexOf(" — "),r=i>=0&&EN[s.slice(i+3).trim()];if(r)s=s.slice(0,i+3)+r;
 for(const[x,e]of RX)s=s.replace(x,e);return s}
function walk(n){if(n.nodeType===3){const v=tx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
 else if(n.nodeType===1){["placeholder","aria-label","title"].forEach(a=>{const v=n.getAttribute&&n.getAttribute(a);if(v&&hasTh(v)){const w=tx(v);if(w!==v)n.setAttribute(a,w)}});n.childNodes.forEach(walk)}}
new MutationObserver(ms=>{if(S.lang!=="en")return;ms.forEach(m=>m.type==="characterData"?walk(m.target):m.addedNodes.forEach(walk))}).observe(document.body,{childList:true,subtree:true,characterData:true});
